services:
  web:
    image: ${ATHLOS_WEB_IMAGE:?ATHLOS_WEB_IMAGE must be set to an immutable GHCR digest}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
      NATIVE_COLLECTIONS_WEB_ENABLED: ${NATIVE_COLLECTIONS_WEB_ENABLED:-false}
    ports:
      - "3100:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - beta

  api:
    image: ${ATHLOS_API_IMAGE:?ATHLOS_API_IMAGE must be set to an immutable GHCR digest}
    restart: unless-stopped
    env_file:
      - .env.beta
    ports:
      - "4100:3001"
    volumes:
      - ./backups-beta:/var/backups/athlos
      - /tmp/legacy-placeholder:/legacy:ro
      - storage-beta:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - beta
      - database

networks:
  beta:
  database:
    external: true
    name: athlos_default

volumes:
  storage-beta:
