name: deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: athlos
          POSTGRES_PASSWORD: athlos
          POSTGRES_DB: athlos_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Postgres
        run: |
          for _ in {1..30}; do
            pg_isready -h localhost -p 5432 -U athlos && break
            sleep 1
          done
      - name: Run tests
        env:
          DATABASE_URL: postgresql://athlos:athlos@localhost:5432/athlos_test
          ATHLOS_TEST_DATABASE_URL: postgresql://athlos:athlos@localhost:5432/athlos_test
          NODE_ENV: test
        run: pnpm test:run
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @athlos/api build

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/victor0451/athlos-api
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=main-,enable={{is_default_branch}}
            type=raw,value={{version}},enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=long
          flavor: |
            latest=auto
            prefix=
            suffix=

      - uses: docker/build-push-action@v5
        id: push
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      image-reference: ${{ format('ghcr.io/victor0451/athlos-api@{0}', steps.push.outputs.digest) }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    permissions:
      contents: read
      packages: write
    env:
      ATHLOS_API_IMAGE: ${{ needs.publish.outputs.image-reference }}
      DEPLOY_HOST: 100.78.95.34
      DEPLOY_PORT: 2244
      DEPLOY_USER: vlongo
      DEPLOY_PATH: /srv/apps/athlos

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This action creates an ephemeral runner node before any connectivity check.
      - name: Join Tailnet
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8
        with:
          oauth-client-id: ${{ secrets.DEPLOY_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.DEPLOY_TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          hostname: deploy-ci-runner

      - name: Materialize restricted SSH material
        run: |
          umask 077
          DEPLOY_SSH_KEY_FILE="$RUNNER_TEMP/deploy_ssh_key"
          DEPLOY_KNOWN_HOSTS_FILE="$RUNNER_TEMP/deploy_known_hosts"
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > "$DEPLOY_SSH_KEY_FILE"
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > "$DEPLOY_KNOWN_HOSTS_FILE"
          chmod 600 "$DEPLOY_SSH_KEY_FILE" "$DEPLOY_KNOWN_HOSTS_FILE"
          printf 'DEPLOY_SSH_KEY_FILE=%s\n' "$DEPLOY_SSH_KEY_FILE" >> "$GITHUB_ENV"
          printf 'DEPLOY_KNOWN_HOSTS_FILE=%s\n' "$DEPLOY_KNOWN_HOSTS_FILE" >> "$GITHUB_ENV"

      - name: Run restricted read-only preflight
        run: ./scripts/deploy/request.sh preflight

      - name: Request production deploy
        run: ./scripts/deploy/request.sh deploy

      - name: Remove restricted SSH material
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/deploy_ssh_key" "$RUNNER_TEMP/deploy_known_hosts"
