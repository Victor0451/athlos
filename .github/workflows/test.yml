name: test

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: athlos
          POSTGRES_PASSWORD: athlos
          POSTGRES_DB: athlos_test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://athlos:athlos@localhost:5432/athlos_test
      ATHLOS_TEST_DATABASE_URL: postgresql://athlos:athlos@localhost:5432/athlos_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version auto-detected from package.json `packageManager` (pnpm@9.15.9)
        # — do NOT set `version:` explicitly or pnpm/action-setup@v4 fails with
        # "Multiple versions of pnpm specified" (ERR_PNPM_BAD_PM_VERSION).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U athlos && break
            sleep 1
          done
      - run: pnpm test:run
      - run: pnpm typecheck
      - run: pnpm --filter @athlos/api build

  drift-check:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: athlos
          POSTGRES_PASSWORD: athlos
          POSTGRES_DB: athlos
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://athlos:athlos@localhost:5432/athlos
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U athlos && break
            sleep 1
          done
      - name: drizzle-kit check (drift gate)
        run: pnpm --filter @athlos/db exec drizzle-kit check

  backup-bats:
    runs-on: ubuntu-latest
    needs: drift-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: athlos
          POSTGRES_PASSWORD: athlos
          POSTGRES_DB: athlos
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://athlos:athlos@localhost:5432/athlos
      BACKUP_DIR: /tmp/athlos-backup-test
      BACKUP_RETENTION_DAYS: 7
      NODE_ENV: test
      USB_DEVICE: /dev/disk/by-label/athlos-backup-usb
      USB_KEYFILE: /root/athlos-usb.key
      USB_MAPPER: athlos-backup-usb
      USB_MOUNT_POINT: /mnt/athlos-backup-usb
      USB_RETENTION_DAYS: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U athlos && break
            sleep 1
          done
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck postgresql-client cryptsetup rsync
      - name: shellcheck (must be clean)
        run: shellcheck scripts/backup.sh scripts/restore.sh scripts/lib/common.sh scripts/mount-usb.sh scripts/unmount-usb.sh scripts/backup-to-usb.sh scripts/setup-usb.sh
      - name: bats tests (must all pass)
        run: bats scripts/tests/common.test.bats scripts/tests/backup.test.bats scripts/tests/restore.test.bats scripts/tests/mount-usb.test.bats scripts/tests/unmount-usb.test.bats scripts/tests/backup-to-usb.test.bats scripts/tests/setup-usb.test.bats

  docker-build-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t athlos-api:smoke .

      - name: "Smoke test: node version"
        run: docker run --rm athlos-api:smoke node --version

      - name: "Smoke test: entrypoint present"
        run: docker run --rm --entrypoint /bin/ls athlos-api:smoke /usr/local/bin/docker-entrypoint.sh

      - name: "Smoke test: non-root user"
        run: docker run --rm --entrypoint /usr/bin/id athlos-api:smoke

  labeler:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}
