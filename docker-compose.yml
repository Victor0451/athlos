services:
  api:
    image: ${ATHLOS_API_IMAGE:?ATHLOS_API_IMAGE must be set to an immutable GHCR digest}
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "4000:3001"
    volumes:
      - ./backups:/var/backups/athlos
      - /tmp/legacy-placeholder:/legacy:ro
      # PR 8c.1 (athlos-socio-legajo): named volume for the
      # `socio_attachments` on-disk storage. Survives container
      # restarts; rolling deploy required so existing containers
      # pick up the mount.
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backups:
  storage:
