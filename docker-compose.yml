# docker-compose.yml — Athlos production stack (Slice C)
#
# Services:
#   db  — Postgres 17 Alpine, persisted via named volume pgdata.
#   api — Node 22 Alpine multi-stage build, runs migrations + backup in entrypoint.
#
# Usage:
#   cp .env.example .env.production && vim .env.production
#   docker compose up -d
#   docker compose ps
#   curl http://localhost:3001/health/ready

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-athlos}
      POSTGRES_USER: ${POSTGRES_USER:-athlos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-athlos} -d ${POSTGRES_DB:-athlos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - athlos-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/victor0451/athlos-api:local
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS: "true"
      BACKUP_BEFORE_MIGRATE: "true"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://${POSTGRES_USER:-athlos}:${POSTGRES_PASSWORD:-}@db:5432/${POSTGRES_DB:-athlos}
      PROMOTION_CRON: ${PROMOTION_CRON:-0 */6 * * *}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - ./backups:/var/backups/athlos
      - ./legacy:/legacy:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - athlos-net

volumes:
  pgdata:

networks:
  athlos-net:
    driver: bridge