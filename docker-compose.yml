services:
  api:
    image: ghcr.io/victor0451/athlos-api:latest
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "4000:3001"
    volumes:
      - ./backups:/var/backups/athlos
      - /tmp/legacy-placeholder:/legacy:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backups:
